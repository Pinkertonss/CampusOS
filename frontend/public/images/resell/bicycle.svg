<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" />
  
  <!-- Ground Line -->
  <line x1="40" y1="245" x2="360" y2="245" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,6" />
  
  <!-- Rear Wheel -->
  <g transform="translate(100, 195)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#334155" stroke-width="6" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#94a3b8" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#1e293b" />
    <!-- Spokes -->
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="-30" y1="-30" x2="30" y2="30" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="-30" y1="30" x2="30" y2="-30" stroke="#cbd5e1" stroke-width="1.5" />
  </g>
  
  <!-- Front Wheel -->
  <g transform="translate(300, 195)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#334155" stroke-width="6" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#94a3b8" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#1e293b" />
    <!-- Spokes -->
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="-30" y1="-30" x2="30" y2="30" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="-30" y1="30" x2="30" y2="-30" stroke="#cbd5e1" stroke-width="1.5" />
  </g>
  
  <!-- Bicycle Frame Tubes (Diamond Frame) -->
  <g stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bottom Bracket to Rear Dropouts -->
    <line x1="180" y1="195" x2="100" y2="195" />
    <!-- Seat Tube: Bottom Bracket to Seat Cluster -->
    <line x1="180" y1="195" x2="155" y2="115" />
    <!-- Seat Stays: Seat Cluster to Rear Dropouts -->
    <line x1="155" y1="115" x2="100" y2="195" />
    <!-- Down Tube: Bottom Bracket to Head Tube -->
    <line x1="180" y1="195" x2="265" y2="105" />
    <!-- Top Tube: Seat Cluster to Head Tube -->
    <line x1="155" y1="115" x2="265" y2="105" />
    <!-- Front Fork: Head Tube to Front Dropouts -->
    <line x1="272" y1="95" x2="300" y2="195" stroke="#047857" />
  </g>
  
  <!-- Chain & Chainring -->
  <circle cx="180" cy="195" r="14" fill="#334155" />
  <circle cx="180" cy="195" r="10" fill="#f8fafc" />
  
  <!-- Pedals -->
  <line x1="180" y1="195" x2="170" y2="215" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <rect x="160" y="213" width="20" height="6" rx="2" fill="#0f172a" />
  
  <!-- Seatpost & Saddle -->
  <line x1="155" y1="115" x2="150" y2="95" stroke="#334155" stroke-width="5" />
  <path d="M 130 95 C 130 90 175 90 175 95 C 170 102 160 100 130 95 Z" fill="#0f172a" />
  
  <!-- Handlebars & Stem -->
  <line x1="265" y1="105" x2="268" y2="78" stroke="#334155" stroke-width="5" />
  <path d="M 268 78 L 278 78 C 285 78 290 85 285 95" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
</svg>
