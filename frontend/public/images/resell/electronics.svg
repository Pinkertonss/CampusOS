<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9" rx="16" />
  
  <!-- Mechanical Keyboard -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="200" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Keys rows -->
    <g fill="#475569" rx="2">
      <rect x="8" y="8" width="14" height="10" rx="1" fill="#f59e0b" />
      <rect x="26" y="8" width="14" height="10" rx="1" />
      <rect x="44" y="8" width="14" height="10" rx="1" />
      <rect x="62" y="8" width="14" height="10" rx="1" />
      <rect x="80" y="8" width="14" height="10" rx="1" />
      <rect x="98" y="8" width="14" height="10" rx="1" />
      <rect x="116" y="8" width="14" height="10" rx="1" />
      <rect x="134" y="8" width="14" height="10" rx="1" />
      <rect x="152" y="8" width="14" height="10" rx="1" />
      <rect x="170" y="8" width="22" height="10" rx="1" fill="#0d9488" />
      
      <!-- Row 2 -->
      <rect x="8" y="22" width="18" height="10" rx="1" />
      <rect x="30" y="22" width="14" height="10" rx="1" />
      <rect x="48" y="22" width="14" height="10" rx="1" />
      <rect x="66" y="22" width="14" height="10" rx="1" />
      <rect x="84" y="22" width="14" height="10" rx="1" />
      <rect x="102" y="22" width="14" height="10" rx="1" />
      <rect x="120" y="22" width="14" height="10" rx="1" />
      <rect x="138" y="22" width="14" height="10" rx="1" />
      <rect x="156" y="22" width="14" height="10" rx="1" />
      <rect x="174" y="22" width="18" height="10" rx="1" />
      
      <!-- Spacebar row -->
      <rect x="60" y="48" width="80" height="10" rx="2" fill="#0284c7" />
    </g>
  </g>
  
  <!-- Wireless Mouse -->
  <g transform="translate(320, 165)">
    <rect x="0" y="0" width="34" height="52" rx="17" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <line x1="17" y1="5" x2="17" y2="24" stroke="#475569" stroke-width="1.5" />
    <rect x="14" y="10" width="6" height="10" rx="3" fill="#38bdf8" />
  </g>
  
  <!-- Monitor Display -->
  <g transform="translate(130, 40)">
    <!-- Stand -->
    <rect x="62" y="90" width="16" height="30" fill="#64748b" />
    <ellipse cx="70" cy="120" rx="35" ry="6" fill="#334155" />
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="140" height="92" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Display Panel -->
    <rect x="6" y="6" width="128" height="80" rx="3" fill="url(#laptopScreen)" />
    <!-- Code Editor UI Mock -->
    <circle cx="14" cy="14" r="2.5" fill="#ef4444" />
    <circle cx="21" cy="14" r="2.5" fill="#f59e0b" />
    <circle cx="28" cy="14" r="2.5" fill="#10b981" />
    <line x1="12" y1="26" x2="55" y2="26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="36" x2="80" y2="36" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="46" x2="65" y2="46" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="56" x2="40" y2="56" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
