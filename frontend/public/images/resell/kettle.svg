<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="kettleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="blackPlastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#fffbeb" rx="16" />
  
  <!-- Base Stand -->
  <ellipse cx="200" cy="240" rx="75" ry="16" fill="url(#blackPlastic)" stroke="#1e293b" stroke-width="2" />
  <rect x="135" y="235" width="130" height="8" rx="3" fill="#1e293b" />
  <path d="M 270 240 Q 300 242 320 255" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

  <!-- Kettle Body -->
  <path d="M 150 115 L 135 225 C 135 235 265 235 265 225 L 250 115 Z" fill="url(#kettleBody)" stroke="#475569" stroke-width="2" />
  
  <!-- Spout -->
  <path d="M 150 120 L 115 135 L 118 150 L 145 155 Z" fill="url(#kettleBody)" stroke="#475569" stroke-width="2" />
  
  <!-- Handle -->
  <path d="M 245 125 C 295 130 295 210 245 215 L 245 200 C 275 195 275 145 245 140 Z" fill="url(#blackPlastic)" stroke="#0f172a" stroke-width="2" />
  
  <!-- Lid & Knob -->
  <path d="M 148 115 C 148 100 252 100 252 115 Z" fill="url(#blackPlastic)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="200" cy="100" rx="18" ry="8" fill="url(#blackPlastic)" />
  
  <!-- Water Window & Gauge -->
  <rect x="188" y="145" width="24" height="60" rx="8" fill="#38bdf8" fill-opacity="0.3" stroke="#64748b" stroke-width="1.5" />
  <line x1="192" y1="160" x2="198" y2="160" stroke="#0284c7" stroke-width="2" />
  <line x1="192" y1="175" x2="202" y2="175" stroke="#0284c7" stroke-width="2" />
  <line x1="192" y1="190" x2="198" y2="190" stroke="#0284c7" stroke-width="2" />
  <text x="206" y="178" fill="#0369a1" font-family="sans-serif" font-size="8" font-weight="bold">1.5L</text>
  
  <!-- Power LED Indicator (Red) -->
  <circle cx="200" cy="225" r="4" fill="#ef4444" stroke="#991b1b" stroke-width="1" />
  <circle cx="200" cy="225" r="6" fill="#ef4444" fill-opacity="0.4" />
  
  <!-- Steam Trails -->
  <path d="M 110 125 Q 95 100 115 80 Q 135 60 120 40" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 125 120 Q 140 95 125 75 Q 110 55 130 35" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.5" />
</svg>
