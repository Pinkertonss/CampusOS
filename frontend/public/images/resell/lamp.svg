<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a" rx="16" />
  
  <!-- Desk Base Surface -->
  <line x1="50" y1="260" x2="350" y2="260" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  
  <!-- Light Beam Cone -->
  <polygon points="175,95 80,260 270,260" fill="url(#lampGlow)" />
  
  <!-- Books on Desk -->
  <rect x="110" y="240" width="85" height="18" rx="2" fill="#0284c7" />
  <rect x="115" y="224" width="75" height="16" rx="2" fill="#d97706" />
  <rect x="120" y="210" width="65" height="14" rx="2" fill="#0d9488" />
  
  <!-- Lamp Base -->
  <ellipse cx="270" cy="255" rx="35" ry="10" fill="#334155" stroke="#475569" stroke-width="2" />
  <circle cx="270" cy="252" r="4" fill="#f59e0b" />
  
  <!-- Articulated Arms -->
  <line x1="270" y1="250" x2="250" y2="160" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <circle cx="250" cy="160" r="7" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  
  <line x1="250" y1="160" x2="195" y2="90" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <circle cx="195" cy="90" r="7" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  
  <!-- Lamp Shade / Hood -->
  <path d="M 195 90 L 160 85 L 150 110 L 195 105 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
  <!-- Bulb -->
  <circle cx="175" cy="100" r="10" fill="#fde047" />
</svg>
