<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#ecfdf5" rx="16" />
  
  <!-- Hanger -->
  <path d="M 200 45 L 200 35 C 200 25 215 25 215 35 C 215 42 205 45 200 50 L 130 90 L 270 90 Z" fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Lab Coat Body -->
  <path d="M 140 85 L 110 135 L 135 145 L 145 115 L 145 265 L 255 265 L 255 115 L 265 145 L 290 135 L 260 85 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Collar & Lapels -->
  <path d="M 175 85 L 200 135 L 225 85" fill="none" stroke="#94a3b8" stroke-width="3" />
  <path d="M 175 85 L 160 140 L 195 160" fill="none" stroke="#94a3b8" stroke-width="2" />
  <path d="M 225 85 L 240 140 L 205 160" fill="none" stroke="#94a3b8" stroke-width="2" />
  <line x1="200" y1="160" x2="200" y2="265" stroke="#cbd5e1" stroke-width="2" />

  <!-- Pockets -->
  <rect x="155" y="165" width="28" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <rect x="155" y="215" width="35" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <rect x="210" y="215" width="35" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  
  <!-- Chemistry Pen & TIET Badge in Pocket -->
  <line x1="162" y1="155" x2="162" y2="175" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <line x1="168" y1="158" x2="168" y2="175" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
  
  <!-- Safety Goggles placed nearby -->
  <g transform="translate(240, 150)">
    <rect x="0" y="0" width="80" height="35" rx="14" fill="url(#glassesGrad)" stroke="#0284c7" stroke-width="3" />
    <circle cx="23" cy="17" r="12" fill="#ffffff" fill-opacity="0.3" stroke="#0284c7" stroke-width="2" />
    <circle cx="57" cy="17" r="12" fill="#ffffff" fill-opacity="0.3" stroke="#0284c7" stroke-width="2" />
    <path d="M 35 17 Q 40 12 45 17" fill="none" stroke="#0284c7" stroke-width="3" />
    <path d="M 0 17 Q -10 17 -15 25 M 80 17 Q 90 17 95 25" fill="none" stroke="#0369a1" stroke-width="2" />
  </g>
  
  <!-- Label Tag -->
  <rect x="160" y="270" width="80" height="18" rx="4" fill="#0f766e" />
  <text x="200" y="283" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SIZE 38 · 100% COTTON</text>
</svg>
