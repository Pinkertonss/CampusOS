<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="bookSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" />
  <!-- Underlay Book -->
  <rect x="70" y="80" width="220" height="150" rx="8" fill="#1e293b" opacity="0.15" />
  <rect x="80" y="75" width="210" height="145" rx="6" fill="#334155" />
  <path d="M 80 220 L 290 220 L 295 210 L 85 210 Z" fill="url(#bookPages)" />
  <text x="185" y="150" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DATABASE SYSTEM CONCEPTS</text>

  <!-- Foreground Main Textbook -->
  <g transform="translate(40, -10)">
    <!-- Book Shadow -->
    <path d="M 95 65 L 285 45 L 295 235 L 105 255 Z" fill="#0f172a" opacity="0.2" />
    <!-- Book Spine -->
    <path d="M 85 70 L 105 67 L 105 252 L 85 255 Z" fill="url(#bookSpine)" />
    <!-- Book Cover -->
    <path d="M 105 67 L 275 50 L 275 235 L 105 252 Z" fill="url(#bookCover)" stroke="#0369a1" stroke-width="2" />
    <!-- Spine lines -->
    <line x1="90" y1="90" x2="100" y2="88" stroke="#38bdf8" stroke-width="2" />
    <line x1="90" y1="230" x2="100" y2="228" stroke="#38bdf8" stroke-width="2" />
    <!-- Book Title & Artwork -->
    <rect x="120" y="80" width="135" height="135" rx="6" fill="#0f172a" fill-opacity="0.3" />
    <circle cx="187" cy="125" r="28" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <path d="M 172 125 L 202 125 M 187 110 L 187 140" stroke="#bae6fd" stroke-width="2" />
    <text x="187" y="172" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">OPERATING SYSTEMS</text>
    <text x="187" y="188" fill="#bae6fd" font-family="sans-serif" font-size="9" text-anchor="middle">CONCEPTS · 10TH ED.</text>
    <text x="187" y="204" fill="#93c5fd" font-family="sans-serif" font-size="8" text-anchor="middle">Silberschatz · Galvin · Gagne</text>
    <!-- Bookmark Ribbon -->
    <path d="M 230 54 L 240 53 L 240 100 L 235 93 L 230 100 Z" fill="#e11d48" />
  </g>
</svg>
