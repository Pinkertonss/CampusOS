<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" />
  
  <!-- Study Chair -->
  <g transform="translate(90, 80)">
    <!-- Backrest -->
    <rect x="20" y="20" width="45" height="55" rx="6" fill="#1e293b" />
    <line x1="42" y1="75" x2="42" y2="95" stroke="#475569" stroke-width="6" />
    <!-- Seat -->
    <rect x="15" y="95" width="55" height="12" rx="4" fill="#0f172a" />
    <!-- Chair Legs -->
    <line x1="20" y1="107" x2="10" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="65" y1="107" x2="75" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="107" x2="42" y2="170" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <!-- Study Table -->
  <g transform="translate(160, 95)">
    <!-- Table Top -->
    <rect x="10" y="40" width="180" height="16" rx="4" fill="url(#woodGrad)" stroke="#451a03" stroke-width="2" />
    <!-- Drawer Unit -->
    <rect x="130" y="56" width="55" height="75" rx="2" fill="#d97706" stroke="#78350f" stroke-width="2" />
    <line x1="130" y1="80" x2="185" y2="80" stroke="#78350f" stroke-width="1.5" />
    <line x1="130" y1="105" x2="185" y2="105" stroke="#78350f" stroke-width="1.5" />
    <!-- Drawer Handles -->
    <circle cx="157" cy="68" r="3" fill="#f8fafc" />
    <circle cx="157" cy="92" r="3" fill="#f8fafc" />
    <circle cx="157" cy="117" r="3" fill="#f8fafc" />
    <!-- Table Legs -->
    <line x1="25" y1="56" x2="25" y2="155" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <line x1="40" y1="56" x2="40" y2="155" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="140" y1="131" x2="140" y2="155" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <line x1="175" y1="131" x2="175" y2="155" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
