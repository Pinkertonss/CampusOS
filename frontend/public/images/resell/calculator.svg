<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="calcScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="solarCell" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9" rx="16" />
  <!-- Calculator Body -->
  <rect x="110" y="25" width="180" height="250" rx="18" fill="url(#calcBg)" stroke="#334155" stroke-width="3" />
  <!-- Brand Header -->
  <text x="130" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">CASIO</text>
  <text x="210" y="52" fill="#38bdf8" font-family="monospace" font-size="9">fx-991EX</text>
  <!-- Solar Panel -->
  <rect x="225" y="40" width="45" height="15" rx="3" fill="url(#solarCell)" stroke="#1e293b" />
  <line x1="240" y1="40" x2="240" y2="55" stroke="#92400e" stroke-width="1" />
  <line x1="255" y1="40" x2="255" y2="55" stroke="#92400e" stroke-width="1" />
  <!-- LCD Screen -->
  <rect x="125" y="65" width="150" height="42" rx="6" fill="url(#calcScreen)" stroke="#0f172a" stroke-width="2" />
  <text x="132" y="82" fill="#1e293b" font-family="monospace" font-size="11">∫(3x² + 2x) dx</text>
  <text x="250" y="100" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">42.000</text>
  <!-- Function Keys -->
  <g fill="#334155" rx="3">
    <rect x="126" y="118" width="22" height="14" rx="3" />
    <rect x="156" y="118" width="22" height="14" rx="3" />
    <rect x="186" y="118" width="22" height="14" rx="3" />
    <rect x="216" y="118" width="22" height="14" rx="3" />
    <rect x="246" y="118" width="28" height="14" rx="3" fill="#0d9488" />
    <rect x="126" y="138" width="22" height="14" rx="3" />
    <rect x="156" y="138" width="22" height="14" rx="3" />
    <rect x="186" y="138" width="22" height="14" rx="3" />
    <rect x="216" y="138" width="22" height="14" rx="3" />
    <rect x="246" y="138" width="28" height="14" rx="3" fill="#e11d48" />
  </g>
  <!-- Numeric & Operator Keys Grid -->
  <g fill="#1e293b">
    <!-- Row 1 -->
    <rect x="126" y="160" width="30" height="20" rx="4" fill="#475569" />
    <rect x="164" y="160" width="30" height="20" rx="4" fill="#475569" />
    <rect x="202" y="160" width="30" height="20" rx="4" fill="#475569" />
    <rect x="240" y="160" width="34" height="20" rx="4" fill="#d97706" />
    <!-- Row 2 -->
    <rect x="126" y="186" width="30" height="20" rx="4" fill="#475569" />
    <rect x="164" y="186" width="30" height="20" rx="4" fill="#475569" />
    <rect x="202" y="186" width="30" height="20" rx="4" fill="#475569" />
    <rect x="240" y="186" width="34" height="20" rx="4" fill="#d97706" />
    <!-- Row 3 -->
    <rect x="126" y="212" width="30" height="20" rx="4" fill="#475569" />
    <rect x="164" y="212" width="30" height="20" rx="4" fill="#475569" />
    <rect x="202" y="212" width="30" height="20" rx="4" fill="#475569" />
    <rect x="240" y="212" width="34" height="20" rx="4" fill="#0284c7" />
    <!-- Row 4 -->
    <rect x="126" y="238" width="30" height="20" rx="4" fill="#475569" />
    <rect x="164" y="238" width="30" height="20" rx="4" fill="#475569" />
    <rect x="202" y="238" width="30" height="20" rx="4" fill="#0284c7" />
    <rect x="240" y="238" width="34" height="20" rx="4" fill="#0d9488" />
  </g>
  <!-- Labels -->
  <text x="141" y="174" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">7</text>
  <text x="179" y="174" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">8</text>
  <text x="217" y="174" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">9</text>
  <text x="257" y="174" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DEL</text>
  <text x="141" y="200" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4</text>
  <text x="179" y="200" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5</text>
  <text x="217" y="200" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">6</text>
  <text x="257" y="200" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">×</text>
  <text x="141" y="226" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
  <text x="179" y="226" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>
  <text x="217" y="226" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
  <text x="257" y="226" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+</text>
  <text x="141" y="252" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">0</text>
  <text x="179" y="252" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">.</text>
  <text x="217" y="252" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">EXP</text>
  <text x="257" y="252" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">=</text>
</svg>
